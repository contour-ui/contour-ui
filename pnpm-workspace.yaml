packages:
  - packages/*
  - apps/*
  - configs/*

# Every external dependency version comes from the catalog below.
catalogMode: strict

# Fail installs whose engines (node/pnpm) do not match, including the root
# package.json `engines.pnpm: ">=12"`.
engineStrict: true

# Vite+ manages the pnpm and Node.js versions (`packageManager` / `.nvmrc`).
# `ignore` stops pnpm from silently downloading the pinned pnpm itself, so an
# older pnpm reaches the `engines.pnpm` check and fails fast instead.
# https://viteplus.dev/guide/env (Using pnpm with Vite+ runtime management)
pmOnFail: ignore
runtimeOnFail: ignore

catalog:
  # Toolchain. `vite` is aliased to the Vite core that Vite+ ships, so tools
  # that import `vite` directly (React Router, plugins) get the same
  # build as `vp`. Keep both entries on the same Vite+ version.
  vite-plus: 1.4.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  # Same version Vite+ bundles; needed directly by third-party Vitest plugins
  # (vitest-browser-react) that import `vitest`.
  vitest: 5.0.5
  '@vitest/browser-playwright': 5.0.5
  # The screenshot tests run Chromium of mcr.microsoft.com/playwright:v<this version>-noble
  # (scripts/visual.ts): keep the image tag in .github/workflows/ci.yml equal to it.
  playwright: 1.64.1
  # End-to-end tests of the docs (apps/docs/e2e). Keep it equal to `playwright`.
  '@playwright/test': 1.64.1
  # Accessibility checks of the docs pages in the end-to-end tests (apps/docs/e2e). axe-core is
  # MPL-2.0, allowed as a test-only dependency (2026-10-26): it never ships in a package or the
  # site.
  '@axe-core/playwright': 4.14.0
  # The screenshot tests check each state with axe in the browser (@contour-ui/vite-config/visual):
  # the axe-core @axe-core/playwright brings, so one copy is installed. Test-only, as above.
  axe-core: 4.14.0
  typescript: 7.0.2
  '@types/node': 24.19.2

  # React
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  vitest-browser-react: 2.3.0

  # Positioning of floating elements (popovers, menus). Runtime dependencies of the published
  # packages: core computes positions with the platform-agnostic core, headless measures the DOM
  # with the DOM platform. Keep both on the same version: dom depends on core.
  '@floating-ui/core': 1.8.0
  '@floating-ui/dom': 1.8.0

  # Soundor, the plugin UI runtime of @contour-ui/soundor (one release group: keep them equal).
  # @soundor/react is its renderer, a peer of the package; @soundor/environment declares the
  # runtime's modules and Web globals, in place of the DOM; the rest runs its tests in Node on a
  # simulated runtime.
  '@soundor/react': 0.14.0
  '@soundor/environment': 0.14.0
  '@soundor/vitest': 0.14.0
  '@soundor/testing-library': 0.14.0
  vitest-environment-soundor: 0.14.0
  # The sandbox app (apps/soundor-sandbox): the CLI, the config schema and its two runtimes.
  # The runtimes have their own versions; the CLI and the config follow the release group.
  soundor: 0.14.0
  '@soundor/config': 0.14.0
  '@soundor/juce-runtime': 0.13.0
  '@soundor/web-runtime': 0.10.0

  # Design tokens (packages/tokens build-time tooling)
  style-dictionary: 5.7.0
  culori: 4.0.2
  '@types/culori': 4.0.1
  # Icons (packages/icons build-time tooling). Lucide paths (ISC) and the Simple
  # Icons logos (CC0) are compiled into committed data by scripts/build-icons.ts.
  lucide-static: 1.61.0
  simple-icons: 16.35.0
  svgpath: 2.6.0

  # Docs
  fumadocs-core: 16.17.8
  fumadocs-mdx: 15.4.10
  # Code highlighting theme for the docs build (`createCssVariablesTheme`): the Shiki that
  # fumadocs-core uses, so the docs app does not get a second copy.
  shiki: 4.5.0
  '@types/mdx': 2.0.14
  react-router: 8.5.0
  '@react-router/dev': 8.5.0
  '@react-router/node': 8.5.0
  # Required by React Router's built-in entry.server (used for prerendering).
  isbot: 5.2.2

  # Release / package validation
  '@changesets/cli': 3.0.3
  publint: 0.3.25
  '@arethetypeswrong/core': 0.18.5

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.4.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.4.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0'
  - vite-plus@1.4.0
  - fumadocs-core@16.17.8
  - fumadocs-mdx@15.4.10
  - '@soundor/config@0.14.0'
  - '@soundor/core@0.14.0'
  - '@soundor/environment@0.14.0'
  - '@soundor/react@0.14.0'
  - '@soundor/test-runtime@0.14.0'
  - '@soundor/testing-library@0.14.0'
  - '@soundor/vitest@0.14.0'
  - vitest-environment-soundor@0.14.0
  - '@soundor/devtools-client@0.14.0'
  - '@soundor/devtools-protocol@0.14.0'
  - '@soundor/devtools-server@0.14.0'
  - '@soundor/driver@0.14.0'
  - '@soundor/engine@0.5.0'
  - '@soundor/juce-runtime@0.13.0'
  - '@soundor/web-runtime@0.10.0'
  - soundor@0.14.0

# Dependency build scripts. esbuild's postinstall only verifies its binary; the
# platform binary arrives via optionalDependencies, so the script is not needed.
allowBuilds:
  esbuild: false
