name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs (Actions → CI → Run workflow).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Expected pnpm, pinned in package.json#packageManager.
  PNPM_VERSION: 12.15.0

jobs:
  check:
    name: Check (fmt, lint, types, boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
      - name: Verify pinned pnpm
        run: test "$(pnpm --version)" = "$PNPM_VERSION"
      - run: vp check --deny-warnings
      - run: vp run boundaries

  test:
    name: Test (node + Chromium browser mode)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
      - run: vp exec playwright install --with-deps chromium
      - run: vp test

  visual:
    name: Visual (screenshot tests in the pinned Playwright image)
    needs: check
    runs-on: ubuntu-latest
    # The image whose browser `vp run visual` drives locally (scripts/visual.ts), so the
    # committed screenshots compare pixel for pixel. Keep the tag equal to `playwright` in
    # pnpm-workspace.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
      - run: vp run visual:ci
      - name: Upload the screenshots and diffs of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: packages/*/.vitest/attachments

  build:
    name: Build (vp pack + publint + attw)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
      - run: vp run -r build

  sites:
    name: Build the docs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
      - run: vp run --filter @contour-ui/app-docs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: apps/docs/build/client
      # End-to-end and axe tests of the docs build above: the e2e task without its own build.
      - run: vp exec playwright install --with-deps chromium
      - run: vp run --ignore-depends-on @contour-ui/app-docs#e2e
      - name: Upload the e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
      # From main, the tested build goes to GitHub Pages (contour-ui.com). A path the build has no
      # file for gets 404.html, the app without prerendered content, which shows the 404 page with
      # status 404, as the end-to-end server serves it.
      - name: Add the 404 page of a static host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp apps/docs/build/client/__spa-fallback.html apps/docs/build/client/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: apps/docs/build/client

  pages:
    name: Deploy the docs to GitHub Pages
    # Only a fully green run deploys: the docs and their e2e tests, and the screenshots.
    needs: [sites, visual]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
