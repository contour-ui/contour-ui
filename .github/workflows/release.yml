name: Release

# By hand (Actions → Release → Run workflow) until the first release: on a push to main it would
# open the version PR, and publishing needs the NPM_TOKEN secret.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version PR / publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true
          registry-url: https://registry.npmjs.org
      # Opens/updates the "Version Packages" PR while changesets are pending;
      # once it is merged, builds and publishes every package in the fixed group.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: vp run version-packages
          publish-script: vp run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
